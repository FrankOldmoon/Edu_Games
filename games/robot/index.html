<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.appTitle">Robot Orders</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body data-view="list">

<!-- 顶栏只有一条，内容按 data-view 切换：
     列表视图 = 游戏名 + 进度 + 语言 + 重置；游戏视图 = 返回 + 关卡名 + 语言 + 计时 + 读数 + 按钮。
     和 spot-the-difference 的列表页 / 游戏页顶栏一一对应，所以各游戏看起来完全一样。 -->
<header class="bar">
  <button class="back game-only" id="btnToList" type="button" data-i18n="ui.toList">← Level list</button>
  <span class="brand list-only" data-i18n="ui.appTitle">Robot Orders</span>
  <span class="lvname game-only" id="lvName"></span>
  <span class="progress list-only" id="progText"></span>
  <span class="spacer"></span>
  <span id="lang"></span>
  <span class="clock game-only" id="clock">0:00</span>
  <span class="counter game-only" id="steps"></span>
  <span class="readout dim game-only" id="status"></span>
  <button class="btn list-only" id="btnReset" type="button" data-i18n="ui.reset">Reset progress</button>
  <button class="btn list-only" id="btnPlayWithOthers" type="button" data-i18n="ui.playWithOthers">Play with others</button>
  <button class="btn primary game-only" id="btnRun" type="button" data-i18n="ui.run">Run</button>
  <button class="btn game-only" id="btnStep" type="button" data-i18n="ui.stepOne">Step</button>
  <button class="btn game-only" id="btnRewind" type="button" data-i18n="ui.rewind">Reset robot</button>
</header>

<main>
  <section id="viewList" class="list-only">
    <p class="lead" id="lead"></p>
    <div class="levels" id="levels"></div>
    <div class="err" id="err" hidden></div>
  </section>

  <section id="viewGame" class="game-only">
    <!-- 房间：房间号 + 人数 + 邀请/离开。里面由 src/game-ui/room/panel.js 填，单人时整条不显示 -->
    <div class="roombar" id="roomBar" hidden></div>

    <p class="lead" id="tip"></p>

    <div class="timebar" id="timebar" data-i18n-title="ui.timeLeft" title="Time left"></div>

    <div class="arena">
      <div class="mainpane">
        <!-- 房间：还没开始时的面板（改名 + 开始 + 名单）。里面由 room/panel.js 填，
             点开始之后整块收起来 -->
        <div class="lobby" id="lobby" hidden></div>

        <div class="wrap">
          <div class="pane boardpane">
            <header class="pane-head" data-i18n="ui.warehouse">Warehouse</header>
            <div class="boardwrap"><div class="board" id="board"></div></div>
            <div class="legend">
              <span><i class="sw robot"></i><span data-i18n="ui.lgRobot">robot</span></span>
              <span><i class="sw parcel"></i><span data-i18n="ui.lgParcel">parcel</span></span>
              <span><i class="sw goal"></i><span data-i18n="ui.lgGoal">drop zone</span></span>
              <span><i class="sw wall"></i><span data-i18n="ui.lgWall">wall</span></span>
            </div>
          </div>

          <aside class="pane programpane">
            <header class="pane-head" data-i18n="ui.program">Program</header>
            <div class="palette" id="palette">
              <button class="pbtn" type="button" data-op="F"><b>▲</b><span data-i18n="ui.opF">Forward</span></button>
              <button class="pbtn" type="button" data-op="L"><b>↰</b><span data-i18n="ui.opL">Turn left</span></button>
              <button class="pbtn" type="button" data-op="R"><b>↱</b><span data-i18n="ui.opR">Turn right</span></button>
              <button class="pbtn" type="button" data-op="P"><b>✋</b><span data-i18n="ui.opP">Pick up</span></button>
              <button class="pbtn" type="button" data-op="D"><b>⬇</b><span data-i18n="ui.opD">Put down</span></button>
            </div>
            <ol class="prog" id="prog"></ol>
            <div class="progbar">
              <span class="readout dim" id="budget"></span>
              <span class="spacer"></span>
              <button class="btn ghost" id="btnClear" type="button" data-i18n="ui.clear">Clear program</button>
            </div>
          </aside>
        </div>
      </div>

      <!-- 房间：同关头像塔。里面由 room/panel.js 填 -->
      <aside class="tower" id="tower" hidden></aside>
    </div>
  </section>
</main>

<script type="module" src="./assets/game.js"></script>
</body>
</html>
