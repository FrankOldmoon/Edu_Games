<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.appTitle">Python Syntax Spot</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="bar">
  <a class="back" href="../" data-i18n="ui.backToList">← Level list</a>
  <span class="lvname" id="lvName"></span>
  <span class="spacer"></span>
  <span id="lang"></span>
  <span class="clock" id="timer"></span>
  <span class="counter" id="counter"></span>
  <button class="btn" id="btnHint" data-i18n="ui.hint">Hint</button>
  <button class="btn" id="btnRetry" hidden data-i18n="ui.retry">Retry</button>
  <button class="btn primary" id="btnNext" hidden data-i18n="ui.next">Next →</button>
</header>

<main>
  <!-- 房间：房间号 + 人数 + 邀请/离开。里面由 src/game-ui/room/panel.js 填，单人时整条不显示 -->
  <div class="roombar" id="roomBar" hidden></div>

  <p class="lead" id="lead"></p>

  <!-- 倒计时进度条：里面那条 track/fill 和滑块由 src/game-ui/timer.js 生成 -->
  <div class="timebar" id="timebar" data-i18n-title="ui.timeLeft" title="Time left"></div>

  <div class="arena">
    <div class="mainpane">
      <!-- 房间：还没开始时的面板（改名 + 开始 + 名单）。里面由 room/panel.js 填，
           点开始之后整块收起来 -->
      <div class="lobby" id="lobby" hidden></div>

      <div class="boards">
        <section class="board" data-panel="left">
          <header data-i18n="ui.panelLeft">Original code (correct)</header>
          <div class="board-body">
            <div class="gutter"></div>
            <pre class="code"><code class="language-python"></code></pre>
            <div class="marks"></div>
          </div>
        </section>

        <section class="board" data-panel="right">
          <header data-i18n="ui.panelRight">Changed code — click the spots that differ from the left</header>
          <div class="board-body">
            <div class="gutter"></div>
            <pre class="code"><code class="language-python"></code></pre>
            <div class="marks"></div>
          </div>
        </section>
      </div>

      <ul class="notes" id="notes"></ul>
      <div id="extras"></div>
    </div>

    <!-- 房间：同关头像塔。里面由 room/panel.js 填 -->
    <aside class="tower" id="tower" hidden></aside>
  </div>

  <div class="err" id="err" hidden></div>
</main>

<!-- 通关弹框：半透明遮罩 + 成绩卡，卡片里自带「下一关」，不会自己消失。
     找完最后一处先放烟花，3 秒后卡片才弹出来；点遮罩或按 Esc 可以收掉回去看代码。 -->
<div class="celebrate" id="celebrate" hidden></div>

<div class="celebrate-card" id="celebrateCard" hidden>
  <div class="celebrate-check">✓</div>
  <div class="celebrate-title" id="celebrateTitle"></div>
  <div class="celebrate-time" id="celebrateTime"></div>
  <button class="btn primary celebrate-next" id="celebrateNext" type="button"></button>
</div>

<script type="module" src="../assets/play.js"></script>
</body>
</html>
