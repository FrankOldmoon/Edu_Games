<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.appTitle">Slice Shot</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body data-view="list">

<!-- 顶栏只有一条，内容按 data-view 切换：
     列表视图 = 游戏名 + 进度 + 语言 + 重置；游戏视图 = 返回 + 关卡名 + 语言 + 计时 + 读数 + 按钮。
     和 spot-the-difference 的列表页 / 游戏页顶栏一一对应，所以各游戏看起来完全一样。 -->
<header class="bar">
  <button class="back game-only" id="btnToList" type="button" data-i18n="ui.toList">← Level list</button>
  <span class="brand list-only" data-i18n="ui.appTitle">Slice Shot</span>
  <span class="lvname game-only" id="lvName"></span>
  <span class="progress list-only" id="progText"></span>
  <span class="spacer"></span>
  <span id="lang"></span>
  <span class="clock game-only" id="clock">0:00</span>
  <span class="counter game-only" id="status"></span>
  <button class="btn list-only" id="btnReset" type="button" data-i18n="ui.reset">Reset progress</button>
  <button class="btn game-only" id="btnRetry" type="button" data-i18n="ui.retry">Retry</button>
</header>

<main>
  <section id="viewList" class="list-only">
    <p class="lead" id="lead"></p>
    <div class="levels" id="levels"></div>
    <div class="err" id="err" hidden></div>
  </section>

  <section id="viewGame" class="game-only">
    <p class="lead" id="tip"></p>

    <div class="timebar" id="timebar" data-i18n-title="ui.timeLeft" title="Time left"></div>
    <div class="targetbox panel">
      <span class="lbl" data-i18n="ui.target">Target</span>
      <div class="tstrip" id="target"></div>
    </div>

    <div class="stripwrap">
      <div class="strip" id="strip"></div>
      <div class="idxkey">
        <span data-i18n="ui.idxKeyUp">numbers above: index from the front</span>
        <span data-i18n="ui.idxKeyDown">numbers below: index from the back</span>
      </div>
    </div>

    <div class="expr">
      <span class="varname" id="listName">nums</span><span class="punct">[</span><input class="slot" id="start" type="text" inputmode="numeric" autocomplete="off" aria-label="start" data-i18n-placeholder="ui.slotStart"><span class="punct">:</span><input class="slot" id="stop" type="text" inputmode="numeric" autocomplete="off" aria-label="stop" data-i18n-placeholder="ui.slotStop"><span class="punct">:</span><input class="slot" id="step" type="text" inputmode="numeric" autocomplete="off" aria-label="step" data-i18n-placeholder="ui.slotStep"><span class="punct">]</span>
      <button class="btn primary" id="btnFire" type="button" data-i18n="ui.fire">Fire</button>
    </div>
    <p class="exprline" id="exprLine"></p>
    <p class="slotkey" data-i18n-html="ui.slotKey"></p>

    <div class="panel block">
      <header class="pane-head" data-i18n="ui.got">You got</header>
      <div class="tray" id="tray"></div>
    </div>
  </section>
</main>

<script type="module" src="./assets/game.js"></script>
</body>
</html>
