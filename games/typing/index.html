<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.appTitle">Python Code Typing</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body data-view="list">

<!-- 顶栏只有一条，内容按 data-view 切换：
     列表视图 = 游戏名 + 进度 + 语言 + 重置；游戏视图 = 返回 + 关卡名 + 语言 + 计时 + 读数 + 按钮。
     顺序和别的游戏一致，本游戏特有的按钮接在最后。 -->
<header class="bar">
  <button class="back game-only" id="btnToList" type="button" data-i18n="ui.toList">← Level list</button>
  <span class="brand list-only" data-i18n="ui.appTitle">Python Code Typing</span>
  <span class="lvname game-only" id="lvName"></span>
  <span class="progress list-only" id="progText"></span>
  <span class="spacer"></span>
  <span id="lang"></span>
  <span class="clock game-only" id="clock">0:00</span>
  <span class="counter game-only" id="counter"></span>
  <button class="btn list-only" id="btnReset" type="button" data-i18n="ui.reset">Reset progress</button>
  <button class="btn list-only" id="btnPlayWithOthers" type="button" data-i18n="ui.playWithOthers">Play with others</button>
</header>

<main>
  <section id="viewList" class="list-only">
    <p class="lead" id="lead"></p>
    <div class="levels" id="levels"></div>
    <div class="err" id="err" hidden></div>
  </section>

  <section id="viewGame" class="game-only">
    <!-- 房间：房间号 + 邀请链接。单人时整条不显示 -->
    <div class="roombar" id="roomBar" hidden>
      <span class="roomcode" id="roomCode"></span>
      <span class="roommeta" id="roomMeta"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnInvite" type="button" data-i18n="ui.invite">Copy invite link</button>
      <button class="btn ghost" id="btnLeave" type="button" data-i18n="ui.leave">Leave</button>
    </div>

    <p class="lead" id="hint"></p>
    <div class="timebar" id="timebar" data-i18n-title="ui.barTitle" title="Progress"></div>

    <div class="arena">
      <div class="pane">
        <!-- 房间：还没开始时的面板 —— 改名字、看谁进来了、看从哪一关起步。
             开始之后收起来，那一刻起键盘归判定层 -->
        <div class="lobby" id="lobby" hidden>
          <div class="lobbyrow">
            <span class="lbl" id="startAt"></span>
            <button class="btn primary" id="btnStart" type="button" data-i18n="ui.startPlaying">Start</button>
          </div>
          <div class="lobbyrow">
            <label class="lbl" for="nameInput" data-i18n="ui.yourName">Your name</label>
            <input id="nameInput" type="text" maxlength="16" autocomplete="off" spellcheck="false">
          </div>
          <div class="roster" id="roster"></div>
        </div>

        <div class="stats">
          <div class="stat"><div class="k" id="kChars" data-i18n="ui.statChars">Characters</div><div class="v" id="statChars">0 / 0</div></div>
          <div class="stat"><div class="k" id="kWpm" data-i18n="ui.statWpm">WPM</div><div class="v" id="statWpm">0</div></div>
          <div class="stat"><div class="k" id="kAcc" data-i18n="ui.statAcc">Accuracy</div><div class="v" id="statAcc">100%</div></div>
          <div class="stat"><div class="k" id="kErr" data-i18n="ui.statErr">Typos</div><div class="v" id="statErr">0</div></div>
        </div>

        <div class="code" id="code"></div>
        <p class="keytip" id="keytip"></p>
      </div>

      <!-- 房间：头像塔。纵向位置 = 同一关里已经打完的比例 -->
      <aside class="tower" id="tower" hidden>
        <div class="lanes" id="lanes"></div>
        <div class="chips" id="chips"></div>
        <div class="railtop" data-i18n="ui.finishLine">finish</div>
      </aside>
    </div>
  </section>
</main>

<script type="module" src="./assets/game.js"></script>
</body>
</html>
